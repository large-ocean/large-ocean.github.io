<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Diogo Arsénio — Mathematics, research and reflections.">
    <title>Diogo Arsénio</title>

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #091720;
            color: #dce5ea;
            font-family: Georgia, serif;
            font-size: 18px;
            line-height: 1.8;
        }

        main {
            max-width: 850px;
            margin: auto;
            padding: 40px 30px;
        }

        nav {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 15px;
        }

        a {
            color: #9bb8c8;
            text-decoration: none;
        }

        a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        header {
            padding: 100px 0 80px;
        }

        h1 {
            font-size: clamp(36px, 6vw, 48px);
            font-weight: normal;
            letter-spacing: -1px;
            margin: 0 0 20px;
        }

        h2 {
            font-size: 26px;
            font-weight: normal;
            margin-top: 0;
        }

        .affiliation {
            color: #a8bac5;
            margin: 0;
        }

        .interests {
            margin-top: 28px;
        }

        section {
            border-top: 1px solid #293e49;
            padding: 40px 0;
        }

        footer {
            border-top: 1px solid #293e49;
            padding: 30px 0;
            color: #8ca7b6;
            font-size: 15px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <main>

        <nav>
            <a href="#research">Research</a>
            <a href="#teaching">Teaching</a>
            <a href="#reflections">Reflections</a>
        </nav>

        <header>
            <h1>Diogo Arsénio</h1>

            <p class="affiliation">
                Associate Professor of Mathematics
            </p>

            <p class="affiliation">
                <a href="https://nyuad.nyu.edu/en/academics/divisions/science/faculty/diogo-arsenio.html">New York University Abu Dhabi</a>
            </p>

            <p class="interests">
                Partial differential equations and analysis
            </p>
        </header>

        <section id="research">
            <h2>Research</h2>
        </section>

        <section id="teaching">
            <h2>Teaching</h2>
        </section>

        <section id="reflections">
            <h2>Reflections</h2>
        </section>

        <footer>
            Beneath the surface
        </footer>

    </main>
</body>
</html>
